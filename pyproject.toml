[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
target-version = "py314"
line-length = 120
indent-width = 4
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "E401", "F", "I", "B", "A", "C4", "COM", "N", "ICN", "ANN", "D"]
ignore = ["E402", "ANN003", "ANN401", "D1", "N806", "N803", "B904", "D415", "N818"]
fixable = ["ALL"]
unfixable = ["F401"]
pydocstyle.convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
exclude = ["base"]

[tool.ruff.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ANN201", "ANN001", "ANN202"]
"alembic/**/*" = ["ANN201", "ANN001", "ANN202", "F401"]